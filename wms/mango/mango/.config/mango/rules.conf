# ────────────── Window rules ──────────────

# Floating windows
window_rule = is_floating:1,width:1920,height:1080,app_id:org.cachyos.hello
window_rule = is_floating:1,width:1920,height:1080,app_id:org.keepassxc.KeePassXC
window_rule = is_floating:1,width:1920,height:1080,app_id:org.pulseaudio.pavucontrol
window_rule = is_floating:1,width:640,height:480,app_id:gnucash,title:GnuCash Tip Of The Day
window_rule = is_floating:1,width:640,height:480,app_id:org.keepassxc.KeePassXC,title:KeePassXC - Passkey credentials
window_rule = is_floating:1,width:640,height:480,app_id:org.mozilla.Thunderbird,title:Reminder
window_rule = is_floating:1,width:640,height:480,app_id:qalculate-gtk
window_rule = is_floating:1,width:640,height:480,no_force_center:1,app_id:com.nextcloud.desktopclient.nextcloud
window_rule = is_floating:1,width:640,height:480,title:Picture-in-Picture

# Send RS to tag #4
window_rule = tags:4,app_id:RuneScape
window_rule = tags:4,app_id:BoltLauncher

# Blur on windows
window_rule = focused_opacity:0.9,unfocused_opacity:0.7,app_id:com.mitchellh.ghostty

# No blur or animation for slurp selection layer (avoids occlusion and ghosting in screenshots)
layer_rule=no_animation:1,no_blur:1,layer_name:selection
