[widget.clock]
format = "{:%I:%M %p}"

[widget.keyboard_layout]
hide_when_single_layout = true

[widget.launcher]
glyph = "api-app"

[widget.network]
show_label = false

[widget.session]
color = "error"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.temp_cpu]
stat = "cpu_temp"
type = "sysmon"

[widget.temp_gpu]
stat = "gpu_temp"
type = "sysmon"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "thepunkoff/pomodoro:widget"
