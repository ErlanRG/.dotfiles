general {
    hide_cursor = true
    text_trim = true
    fractional_scaling = 2
}

background {
    monitor =
    path = $HOME/Nextcloud/Wallpapers/aishot-2377.jpg
    color = rgba(17, 17, 27, 1.0)

    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── TIME ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 120
    font_family = Iosevka Nerd Font Mono
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(13, 13, 20, 0.7)
    shadow_boost = 1.0

    position = 0, 150
    halign = center
    valign = center
}

# ── DATE — ──────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(180, 190, 254, 0.9)
    font_size = 20
    font_family = Iosevka Nerd Font Mono

    position = 0, -50
    halign = center
    valign = center
}

# ── INPUT FIELD ──────────────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(180, 190, 254, 0.55)
    inner_color = rgba(205, 214, 244, 0.07)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(116, 199, 236, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    capslock_color = rgba(249, 226, 175, 1.0)

    rounding = 20
    fade_on_empty = true
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false

    position = 0, -150
    halign = center
    valign = center
}

# ── KEYBOARD LAYOUT ──────────────────────────────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = rgba(180, 190, 254, 0.8)
    font_size = 14
    font_family = Iosevka Nerd Font Mono

    position = -30, -30
    halign = right
    valign = bottom

    onclick = niri msg action switch-layout next
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}
