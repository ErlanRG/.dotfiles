# Window manager registry.
#
#   name | extra package lists | stow packages (in order)
#
# core.packages is installed for every WM, so it is not listed here.
# wms/wayland-common is deliberately absent: its waybar/wofi files are shared
# through committed repo-relative symlinks inside each WM package, so stowing
# it directly would collide with the WM's own ~/.config/waybar and wofi.

hyprland | hyprland | core hyprland
niri     | niri     | core niri
mango    | mango    | core mango
