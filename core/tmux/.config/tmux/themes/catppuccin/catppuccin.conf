### ─────────────────────────────────────────────────────────────
###  PALETTE
### ─────────────────────────────────────────────────────────────

set -g @ctp_crust    "#11111b"
set -g @ctp_mantle   "#181825"
set -g @ctp_base     "#1e1e2e"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_surface2 "#585b70"
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_overlay1 "#7f849c"
set -g @ctp_overlay2 "#9399b2"

set -g @ctp_text     "#cdd6f4"
set -g @ctp_subtext0 "#a6adc8"

set -g @ctp_red      "#f38ba8"
set -g @ctp_maroon   "#eba0ac"
set -g @ctp_peach    "#fab387"
set -g @ctp_yellow   "#f9e2af"
set -g @ctp_green    "#a6e3a1"
set -g @ctp_teal     "#94e2d5"
set -g @ctp_blue     "#89b4fa"
set -g @ctp_mauve    "#cba6f7"
set -g @ctp_lavender "#b4befe"

### ─────────────────────────────────────────────────────────────
###  STATUS BAR
### ─────────────────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#{@ctp_overlay0}"

# left: session name — dim until the prefix is pressed, then peach
set -g status-left-length 40
set -g status-left ""
set -ga status-left "#[bold]#{?client_prefix,#[fg=#{@ctp_peach}],#[fg=#{@ctp_overlay1}]} #S #[default]  "

# right: clock only
set -g status-right-length 20
set -g status-right ""
set -ga status-right "#[fg=#{@ctp_overlay0}]%H:%M "

### ─────────────────────────────────────────────────────────────
###  WINDOWS
### ─────────────────────────────────────────────────────────────

set -wg automatic-rename on

set -g window-status-separator "  "

set -g window-status-format " #I #W "
set -g window-status-style "fg=#{@ctp_overlay0}"

set -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-style "fg=#{@ctp_green},bold"

set -g window-status-last-style "fg=#{@ctp_overlay2}"
set -g window-status-activity-style "fg=#{@ctp_red}"
set -g window-status-bell-style "fg=#{@ctp_red},bold"

### ─────────────────────────────────────────────────────────────
###  PANES
### ─────────────────────────────────────────────────────────────

setw -g pane-border-status off
setw -g pane-border-lines single
setw -g pane-border-style "fg=#{@ctp_surface1}"
setw -g pane-active-border-style "fg=#{@ctp_overlay1}"

# NOTE: these three are plain *colour* options, not *style* options —
# tmux does not run format substitution on them, so #{@ctp_*} would be
# rejected as "bad colour". They have to be literal hex.
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#a6e3a1"
set -g clock-mode-colour "#a6e3a1"

### ─────────────────────────────────────────────────────────────
###  MESSAGES, MENUS, POPUPS
### ─────────────────────────────────────────────────────────────

set -g message-style "bg=default,fg=#{@ctp_yellow}"
set -g message-command-style "bg=default,fg=#{@ctp_yellow}"

set -g menu-style "bg=#{@ctp_base},fg=#{@ctp_text}"
set -g menu-selected-style "bg=#{@ctp_surface1},fg=#{@ctp_green},bold"
set -g menu-border-style "fg=#{@ctp_surface2}"
set -g menu-border-lines rounded

# tmux-which-key renders in a popup
set -g popup-style "bg=#{@ctp_base},fg=#{@ctp_text}"
set -g popup-border-style "fg=#{@ctp_surface2}"
set -g popup-border-lines rounded

### ─────────────────────────────────────────────────────────────
###  COPY MODE
### ─────────────────────────────────────────────────────────────

set -g mode-style "bg=#{@ctp_surface1},fg=#{@ctp_text}"
set -g copy-mode-match-style "bg=#{@ctp_surface1},fg=#{@ctp_yellow}"
set -g copy-mode-current-match-style "bg=#{@ctp_yellow},fg=#{@ctp_base}"

set -g clock-mode-style 24
